[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ddpm"
version = "0.1.0"
description = "Dell Display and Peripheral Manager (DDPM) clone for Ubuntu"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
ddpm = "ddpm.cli:main"
ddpm-gui = "ddpm.gui:main"

[tool.setuptools.packages.find]
include = ["ddpm*"]
