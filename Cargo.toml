[package]
name = "ddpm"
version = "0.1.0"
edition = "2021"
description = "Dell Display and Peripheral Manager (DDPM) clone for Ubuntu"
license = "MIT"

[lib]
name = "ddpm"
path = "src/lib.rs"

[[bin]]
name = "ddpm"
path = "src/main.rs"

[[bin]]
name = "ddpm-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
libc = "0.2"
wait-timeout = "0.2"
eframe = { version = "0.29", optional = true }

[profile.release]
strip = true
lto = true
